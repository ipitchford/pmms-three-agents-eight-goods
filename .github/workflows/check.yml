name: Formula and small-certificate checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generator dependency
        run: python -m pip install numpy
      - name: Case tables of generator and verifier agree
        run: python test_case_table.py
      - name: Published nine-good counterexamples have no PMMS allocation
        run: python -I verify_nine_good.py /tmp/nine.json
      - name: Six-good formula re-derived and refuted by both checkers
        run: |
          python -I verify_case.py six_goods --goods 6 --case plain --tmp /tmp/v6 --result /tmp/v6.json > /tmp/v6.out
          grep -q ALL_CNF_CLAUSES_INDEPENDENTLY_DERIVED /tmp/v6.out
          grep -q '"expected_not_in_cnf": 0' /tmp/v6.out
          cc -O2 -o /tmp/lrat-check tools/lrat-check.c
          /tmp/lrat-check six_goods/base.cnf <(gunzip -c six_goods/proof.lrat.gz) | tee /tmp/six.out
          grep -q "c VERIFIED" /tmp/six.out
          python -I check_lrat_rup.py six_goods/base.cnf six_goods/proof.lrat.gz | tee /tmp/six_py.out
          grep -q '"status": "VERIFIED"' /tmp/six_py.out
      - name: Negative controls (corrupted formula and proofs are rejected)
        run: python -I controls/negative_controls.py
      - name: All ten eight-good formulas regenerated with the published digests
        run: python ci_check.py /tmp/ci
